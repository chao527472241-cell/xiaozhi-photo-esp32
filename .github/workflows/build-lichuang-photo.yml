name: 编译立创实战派拍照版固件

# 这个工作流会自动去官方仓库拉取 v2.6.0 源码，
# 再用你上传的 esp32_camera.cc 覆盖摄像头驱动，然后编译出固件。
# 所以你只需要上传 2 个小文件，不用上传整套源码（1800 多个文件）。

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build-lichuang:
    name: 编译 lichuang-dev（含拍照传电脑）
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:release-v6.1
    steps:
      # 1. 获取你上传的改造文件（esp32_camera.cc 就在仓库根目录）
      - name: 获取你上传的改造文件
        uses: actions/checkout@v4

      # 2. 自动下载官方小智 v2.6.0 源码（在云端完成，很快）
      - name: 下载官方小智源码 v2.6.0
        uses: actions/checkout@v4
        with:
          repository: 78/xiaozhi-esp32
          ref: v2.6.0
          path: xiaozhi
          fetch-depth: 0

      # 3. 应用改造：拍照传电脑 + 静默转发 + BOOT 按键 PTT + 可配置屏幕面板
      - name: 应用改造
        shell: bash
        run: |
          cp esp32_camera.cc xiaozhi/main/boards/common/esp32_camera.cc
          echo "已覆盖摄像头驱动文件"
          cd xiaozhi
          # 屏幕配置文件从仓库根目录拷进编译目录，供补丁读取
          cp ../screen_config.txt .
          echo "已载入 screen_config.txt"
          python ../patch_silence.py
          echo "已注入静默转发补丁"
          python ../patch_ptt.py
          echo "已注入 BOOT 按键 PTT 补丁"
          python ../patch_screen_panel.py
          echo "已注入可配置屏幕面板补丁（时钟/状态/动图三页 + 触摸设置 + 断电记忆）"

      # 4. 编译（只编译你这一块板，几分钟）
      - name: 编译固件
        shell: bash
        working-directory: xiaozhi
        run: |
          source "$IDF_PATH/export.sh"
          # zh-CN 中文界面；wake-word=wn9_hai1xiao3ou1_tts3 用官方内置短唤醒词"嗨小欧"
          # 内置 wakenet 模型，与"你好小智"同源，稳定不崩
          python scripts/build.py lckfb/szpi-esp32s3 --name lichuang-dev --language zh-CN --wake-word wn9_hai1xiao3ou1_tts3

      # 5. 用 ELF 解析崩溃 backtrace 地址（调试用）
      - name: 解析崩溃符号
        shell: bash
        working-directory: xiaozhi
        run: |
          source "$IDF_PATH/export.sh"
          ELF=$(find build -name "*.elf" | head -1)
          echo "ELF=$ELF"
          if [ -n "$ELF" ]; then
            xtensa-esp32s3-elf-addr2line -e "$ELF" -f -C -i \
              0x420de2c5 0x420e3242 0x420e353c 0x420ebb98 \
              0x421b9b7d 0x420d4595 0x420d96b9 0x420e373c > ../crash_symbols.txt || true
            cat ../crash_symbols.txt
          fi

      # 6. 把编译好的固件存起来供下载
      - name: 上传固件
        uses: actions/upload-artifact@v4
        with:
          name: 立创实战派-拍照传电脑版-嗨小欧-可配置屏幕面板
          path: |
            xiaozhi/build/merged-binary.bin
            crash_symbols.txt
          if-no-files-found: error
